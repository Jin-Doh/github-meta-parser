name: Go Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        # exclude:
        # Exclude unsupported combinations if any
        # For example, arm64 on windows-2019 is not supported
        # - goos: windows
        #   goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: true

      - name: Vet and Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="github-meta-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "${OUTPUT_NAME}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-meta-${{ matrix.goos }}-${{ matrix.goarch }}
          # 와일드카드(*)를 사용해 .exe가 붙은 파일도 찾도록 경로 수정
          path: github-meta-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  tag-on-version-change:
    # main 브랜치에 푸시될 때만 실행되며, build 작업이 성공해야 실행됩니다.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Git 태그를 푸시하려면 contents: write 권한이 필요합니다.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Git 히스토리를 모두 가져와야 태그 조회가 가능합니다.
          fetch-depth: 0

      # 2. main.go 파일에서 VERSION 상수 값 추출
      - name: Extract version from main.go
        id: get_version
        run: |
          # main.go 파일에서 'const VERSION = "X.X.X"' 패턴을 찾아 버전 문자열만 추출합니다.
          VERSION_TAG=$(grep 'VERSION *= *"[^"]*"' main.go | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          
          if [ -z "$VERSION_TAG" ]; then
            echo "VERSION constant not found or format is incorrect in main.go."
            exit 1
          fi
          VERSION_TAG="v$VERSION_TAG"
          
          echo "Found version tag: $VERSION_TAG"
          # 다음 스텝에서 사용할 수 있도록 버전 태그를 GitHub 환경 변수에 저장합니다.
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      # 3. Git 태그가 이미 존재하는지 확인
      - name: Check if tag already exists
        id: check_tag
        run: |
          # 원격 저장소에서 해당 태그가 있는지 확인합니다.
          if git ls-remote --tags origin refs/tags/${{ env.VERSION_TAG }} | grep -q ${{ env.VERSION_TAG }}; then
            echo "Tag ${{ env.VERSION_TAG }} already exists. Nothing to do."
            # 다음 스텝을 건너뛰기 위한 플래그 설정
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "Tag ${{ env.VERSION_TAG }} does not exist. Proceeding to tag."
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      # 4. Git 태그 생성 및 푸시 (태그가 존재하지 않을 경우에만 실행)
      - name: Create and push tag
        # 바로 이전 스텝('check_tag')의 결과(SKIP=false)에 따라 이 스텝의 실행 여부를 결정합니다.
        if: env.SKIP == 'false'
        run: |
          # Git 작업을 위한 사용자 정보 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 태그 생성
          git tag ${{ env.VERSION_TAG }}
          
          # 생성한 태그를 원격 저장소로 푸시
          git push origin ${{ env.VERSION_TAG }}
          echo "Successfully pushed tag ${{ env.VERSION_TAG }}"