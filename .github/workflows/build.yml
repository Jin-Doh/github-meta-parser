name: Go Build, Tag, and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
          cache: true

      - name: Vet and Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="github-meta-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "${OUTPUT_NAME}" main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-meta-${{ matrix.goos }}-${{ matrix.goarch }}
          path: github-meta-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  tag-on-version-change:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # (추가) 다음 잡에서 태그 이름을 사용할 수 있도록 outputs 설정
    outputs:
      VERSION_TAG: ${{ steps.get_version.outputs.VERSION_TAG }}
      IS_NEW_TAG: ${{ steps.check_tag.outputs.IS_NEW_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from main.go
        id: get_version
        run: |
          VERSION_TAG=$(grep 'VERSION *= *"[^"]*"' main.go | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          if [ -z "$VERSION_TAG" ]; then
            echo "VERSION constant not found or format is incorrect in main.go."
            exit 1
          fi
          VERSION_TAG="v$VERSION_TAG"
          echo "Found version tag: $VERSION_TAG"
          # (수정) outputs으로 내보내기 위해 값 설정
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin refs/tags/${{ steps.get_version.outputs.VERSION_TAG }} | grep -q ${{ steps.get_version.outputs.VERSION_TAG }}; then
            echo "Tag ${{ steps.get_version.outputs.VERSION_TAG }} already exists."
            echo "IS_NEW_TAG=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ steps.get_version.outputs.VERSION_TAG }} does not exist. Proceeding to tag."
            echo "IS_NEW_TAG=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.IS_NEW_TAG == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_version.outputs.VERSION_TAG }}
          git push origin ${{ steps.get_version.outputs.VERSION_TAG }}
          echo "Successfully pushed tag ${{ steps.get_version.outputs.VERSION_TAG }}"

  # (추가) 릴리즈 생성 및 파일 업로드를 위한 새로운 Job
  release:
    needs: tag-on-version-change
    # (추가) 새로운 태그가 생성되었을 때만 이 Job을 실행
    if: needs.tag-on-version-change.outputs.IS_NEW_TAG == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # (추가) build 잡에서 업로드한 모든 아티팩트를 다운로드
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # (추가) GitHub Release 생성 및 파일 첨부
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag-on-version-change 잡에서 생성한 태그 이름을 사용
          tag_name: ${{ needs.tag-on-version-change.outputs.VERSION_TAG }}
          # 자동으로 릴리즈 노트를 생성
          generate_release_notes: true
          # 다운로드 받은 아티팩트 파일들을 릴리즈에 첨부
          files: |
            artifacts/**/*
